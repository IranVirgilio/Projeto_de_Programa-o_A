{% extends 'base.html' %}

{% block content %}
<h2>Cadastrar Novo Cliente</h2>
<form method="POST">
    <div class="form-group">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required>
    </div>
    <div class="form-group">
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="Ex: 123.456.789-00" required>
    </div>
    <div class="form-group">
        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" name="telefone" placeholder="Ex: (79) 99999-9999" required>
    </div>
    <div class="form-group">
        <label for="salario">Salário (R$):</label>
        <input type="text" id="salario" name="salario" placeholder="Ex: 2500.00" required>
    </div>
    <button type="submit" class="btn">Salvar Cliente</button>
</form>
{% endblock %}
