{% extends 'base.html' %}

{% block content %}
<h2>Abrir Nova Conta</h2>
<form method="POST">
    <div class="form-group">
        <label for="cpf_cliente">Selecione o Cliente Titular:</label>
        <select id="cpf_cliente" name="cpf_cliente" required>
            {% for cliente in clientes %}
                <option value="{{ cliente.cpf }}">{{ cliente.nome }} (CPF: {{ cliente.cpf }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="tipo">Tipo de Conta:</label>
        <select id="tipo" name="tipo" required>
            <option value="Corrente">Conta Corrente</option>
            <option value="Poupança">Conta Poupança</option>
        </select>
    </div>
    <div class="form-group">
        <label for="numero">Número da Conta:</label>
        <input type="text" id="numero" name="numero" placeholder="Ex: 1001" required>
    </div>
    <div class="form-group">
        <label for="saldo">Saldo Inicial (R$):</label>
        <input type="text" id="saldo" name="saldo" placeholder="Ex: 500.00" required>
    </div>
    <button type="submit" class="btn">Criar Conta</button>
</form>
{% endblock %}
