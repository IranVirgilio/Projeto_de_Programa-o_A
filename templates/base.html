<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Banco Master</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; color: #333; }
        .navbar { background-color: #004085; color: white; padding: 15px 20px; text-align: center; }
        .navbar h2 { margin: 0 0 10px 0; }
        .navbar a { color: white; text-decoration: none; margin: 0 12px; font-weight: 600; font-size: 15px; }
        .navbar a:hover { text-decoration: underline; }
        .container { max-width: 900px; margin: 30px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .btn { display: inline-block; padding: 10px 16px; background: #0056b3; color: white; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #003d82; }
        .btn-secundario { background: #6c757d; padding: 6px 10px; font-size: 13px; }
        .btn-secundario:hover { background: #545b62; }
        .alerta { padding: 12px; margin-bottom: 18px; border-radius: 4px; font-weight: 500; }
        .alerta.sucesso { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alerta.erro { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 25px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f1f3f5; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 9px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .card-patrimonio { background: #e9f2ff; border-left: 5px solid #0056b3; padding: 15px; border-radius: 4px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>Banco Master</h2>
        <a href="/">Início</a>
        <a href="/cadastrar_cliente">Cadastrar Cliente</a>
        <a href="/cadastrar_conta">Abrir Conta</a>
        <a href="/operacao/depositar">Depositar</a>
        <a href="/operacao/sacar">Sacar</a>
        <a href="/operacao/transferir">Transferir</a>
    </div>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alerta {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
